<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- N-01: 首页 - 时间线（选中态）Filled -->
  <!-- 24dp画板, 20dp安全区域, 海洋蓝 #2196F3 -->
  <g transform="translate(2, 2)">
    <!-- 时间轴主线 -->
    <line x1="4" y1="2" x2="4" y2="18" stroke="#2196F3" stroke-width="2" stroke-linecap="round"/>
    <!-- 时间节点1（顶部） -->
    <circle cx="4" cy="3" r="2.5" fill="#2196F3"/>
    <!-- 时间节点2 -->
    <circle cx="4" cy="9" r="2.5" fill="#2196F3"/>
    <!-- 时间节点3 -->
    <circle cx="4" cy="15" r="2.5" fill="#2196F3"/>
    <!-- 内容线条 -->
    <line x1="7" y1="3" x2="16" y2="3" stroke="#2196F3" stroke-width="2" stroke-linecap="round"/>
    <line x1="7" y1="9" x2="14" y2="9" stroke="#2196F3" stroke-width="2" stroke-linecap="round"/>
    <line x1="7" y1="15" x2="12" y2="15" stroke="#2196F3" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>